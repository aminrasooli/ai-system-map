name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          for f in scripts/*.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh tests/*.sh

      - name: Basic tests
        run: bash tests/test-basic.sh

      - name: Validate the example System Map
        run: bash scripts/validate-system-map.sh examples/sample-system-map
